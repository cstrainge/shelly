
[package]
name = "shelly"
description = "A Rust based Unix style shell with a typed and structured language syntax."
version = "0.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.3"
hostname = "0.4.2"
reedline = "0.52.0"
supports-color = "3.0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }

[build-dependencies]
chrono = "0.4.45"
