
[workspace]
resolver = "3"
members = [
        "src/lib/shelly-core",
        "src/lib/shelly-runtime",
        "src/bin/shelly",
        "src/bin/shelly-aot"
    ]

default-members = [
        "src/bin/shelly"
    ]


[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["Chloë Strainge"]
repository = "https://github.com/cstrainge/shelly"
